name: Verify Java, Vue and real MySQL/Redis
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: campus_takeaway_test
          TZ: Asia/Shanghai
        ports: ["127.0.0.1:13317:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["127.0.0.1:16377:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: mvn -B verify
        env:
          RUN_MYSQL_TESTS: 'true'
          TEST_DB_PASSWORD: test-password
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --tag campus-takeaway:verify .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            target/surefire-reports/
            target/campus-takeaway-2.0.0.jar
