services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: campus_takeaway
      MYSQL_USER: takeaway
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:13317:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16377:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_takeaway?serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USERNAME: takeaway
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEMO_DATA: ${DEMO_DATA:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Shanghai
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  mysql-data:
  redis-data:
