spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13317/campus_takeaway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:takeaway}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16377}
      password: ${REDIS_PASSWORD:}
      timeout: 400ms
      connect-timeout: 400ms
  session:
    timeout: 30m
    redis:
      namespace: takeaway:session
      repository-type: default
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
cache:
  enabled: ${CACHE_ENABLED:true}
app:
  demo-data: ${DEMO_DATA:false}
  expiry-enabled: ${EXPIRY_ENABLED:true}
