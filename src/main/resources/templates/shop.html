<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>店铺菜单 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('店铺菜单')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="page-heading"><div><h1 th:text="${shop.name}"></h1><p th:text="${shop.description}"></p></div><a class="button" href="/student/cart">购物车 · <span th:text="${cartCount}"></span></a></div><div class="status-banner"><span class="status COMPLETED">营业中</span> 配送范围：校内　｜　支付方式：模拟支付</div><section data-filter-zone style="margin-top:28px"><div class="toolbar"><div class="category-list no-margin"><button type="button" data-category="" class="active">全部餐品</button><button type="button" th:each="category:${categories}" th:attr="data-category=${category}" th:text="${category}"></button></div><label class="search-label" style="margin-left:auto"><span class="sr-only">搜索餐品</span><input type="search" placeholder="搜索餐品名称…" data-search-input></label></div><div class="grid"><article class="dish-card" th:each="dish:${dishes}" data-filter-item th:attr="data-category=${dish.category}"><img class="dish-photo" th:src="${dish.imagePath}" th:alt="${dish.name}" width="640" height="420" loading="lazy"><div class="eyebrow" th:text="${dish.category}"></div><h3 th:text="${dish.name}"></h3><div class="dish-card-footer"><span class="amount" th:text="${'¥ '+dish.price}"></span><form th:action="@{/student/cart/add}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="dishId" th:value="${dish.id}"><input type="hidden" name="stay" value="true"><button>加入购物车</button></form></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(dishes)}"><h3>暂时没有在售餐品</h3><p>商家正在准备菜单，请稍后再来。</p></div><div class="empty-state no-results" hidden><h3>没有符合条件的餐品</h3><p>试试其他分类或关键词。</p></div></section>
</main></div></body></html>
