<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>个人设置 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head>
<body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('个人设置')}"></header><main class="content">
<div th:replace="~{fragments :: alerts}"></div>
<div class="page-heading"><div><h1>个人设置</h1><p>更新联系方式或修改登录密码。</p></div><a class="button subtle" th:href="${roleHome}">返回工作台</a></div>
<div class="split forms account-settings"><section class="card"><h2>基本资料</h2><p class="muted" th:text="${'账号：'+currentUser.username+' · '+roleLabel}"></p>
<form class="form-grid" th:action="@{/account/profile}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label class="full">姓名<input name="realName" th:value="${currentUser.realName}" maxlength="40" autocomplete="name" required></label>
<label class="full">手机号码<input name="phone" th:value="${currentUser.phone}" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="tel" required></label>
<div class="full"><button>保存资料</button></div></form></section>
<section class="card"><h2>修改密码</h2><p class="muted">修改成功后需要重新登录，其他设备上的旧登录也会失效。</p>
<form class="form-grid" th:action="@{/account/password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label class="full">当前密码<input name="currentPassword" type="password" autocomplete="current-password" maxlength="64" required></label>
<label class="full">新密码<input name="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="64" required><small class="field-hint">6–64 位，不能与当前密码相同。</small></label>
<label class="full">再次输入新密码<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="64" required></label>
<div class="full"><button>修改密码并重新登录</button></div></form></section></div>
</main></div></body></html>
