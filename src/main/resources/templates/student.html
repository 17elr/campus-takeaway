<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>学生中心 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('学生中心')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="welcome student-welcome" th:if="${tab=='overview'}"><div><h1>订餐首页</h1><p>选择店铺点餐，或查看正在进行的订单。<br>当前有 <strong th:text="${#lists.size(shops)}"></strong> 家店铺营业。</p><a class="button light" href="/student?tab=shops">开始点餐</a></div><img class="welcome-photo" src="/images/meal-cover.webp" alt="餐食展示" width="640" height="420"></div>
<div class="stats" th:if="${tab=='overview'}"><a class="stat" href="/student?tab=orders"><div><small>进行中的订单</small><strong th:text="${activeCount}"></strong></div><span class="stat-tag">查看进度</span></a><a class="stat" href="/student/cart"><div><small>购物车餐品</small><strong th:text="${cartCount}"></strong></div><span class="stat-tag">去结算</span></a><a class="stat" href="/student?tab=addresses"><div><small>校内收货地址</small><strong th:text="${#lists.size(addresses)}"></strong></div><span class="stat-tag">管理地址</span></a></div>
<section th:if="${tab=='overview' or tab=='shops'}" data-filter-zone><div class="section-heading"><div><h2>校内店铺 <span class="counter" th:text="${#lists.size(shops)}"></span></h2></div><label class="search-label"><span class="sr-only">搜索店铺</span><input type="search" data-search-input placeholder="搜索店铺名称…"></label></div><div class="grid"><article class="shop-card" th:each="shop:${shops}" data-filter-item><a class="shop-photo-link" th:href="@{/student/shop/{id}(id=${shop.id})}" aria-label="查看店铺菜单"><img class="shop-photo" src="/images/meal-cover.webp" alt="餐食展示" width="640" height="420" loading="lazy"></a><div><span class="status COMPLETED">营业中 · 校内配送</span><h2 th:text="${shop.name}"></h2><p th:text="${shop.description}"></p></div><div class="shop-card-foot"><small>校内配送</small><a th:href="@{/student/shop/{id}(id=${shop.id})}">查看菜单 →</a></div></article></div><div class="empty-state" th:if="${#lists.isEmpty(shops)}"><h3>店铺正在休息</h3><p>稍后再来看看。</p></div><div class="empty-state no-results" hidden><h3>没有找到店铺</h3><p>请试试其他关键词。</p></div></section>
<section th:if="${tab=='orders'}"><div class="page-heading"><div><h1>我的订单</h1><p>在这里查看订单进度、完成模拟支付或确认收货。</p></div><a class="button" href="/student?tab=shops">再点一单</a></div><section th:replace="~{fragments :: orders(${orders})}"></section></section>
<section th:if="${tab=='addresses'}"><div class="page-heading"><div><h1>收货地址</h1><p>配送范围限校内，请填写准确的楼栋和收货点。</p></div></div><div class="split forms"><div><div class="empty-state" th:if="${#lists.isEmpty(addresses)}"><h3>添加第一个收货地址</h3><p>有了地址，就可以提交订单了。</p></div><article class="address-card" th:each="address:${addresses}"><span class="status COMPLETED" th:if="${address.isDefault}">默认收货地址</span><h3 th:text="${address.building+' · '+address.room}"></h3><p th:text="${address.contactName+' / '+address.phone}"></p><div class="actions"><form th:unless="${address.isDefault}" th:action="@{/student/addresses/{id}/default(id=${address.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button subtle">设为默认</button></form><form th:action="@{/student/addresses/{id}/delete(id=${address.id})}" method="post" data-confirm="确定删除这个地址？历史订单快照不会改变。"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button subtle danger-text">删除地址</button></form></div><details class="editor"><summary>编辑地址</summary><form class="form-grid" th:action="@{/student/addresses/{id}/edit(id=${address.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>楼栋<select name="building" required><option th:each="building:${buildings}" th:value="${building}" th:text="${building}" th:selected="${building==address.building}"></option></select></label><label>房间 / 收货点<input name="room" th:value="${address.room}" maxlength="40" required></label><label>联系人<input name="contactName" th:value="${address.contactName}" maxlength="40" required></label><label>手机号码<input name="phone" th:value="${address.phone}" pattern="1[3-9][0-9]{9}" required></label><div class="full"><button>保存修改</button></div></form></details></article></div><section class="card sticky"><h2>新增收货地址</h2><form class="form-grid" th:action="@{/student/addresses}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="full">校内楼栋<select name="building" required><option th:each="building:${buildings}" th:value="${building}" th:text="${building}"></option></select></label><label class="full">房间 / 收货点<input name="room" placeholder="例如 302，或一楼大厅" maxlength="40" required></label><label class="full">联系人<input name="contactName" maxlength="40" required></label><label class="full">手机号码<input name="phone" pattern="1[3-9][0-9]{9}" maxlength="11" required></label><div class="full"><button class="full-button">添加地址</button></div></form></section></div></section>
</main></div></body></html>
