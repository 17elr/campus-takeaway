<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>骑手工作台 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('骑手工作台')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="welcome" th:if="${tab=='overview'}"><div><h1>配送工作台</h1><p>领取校内配送任务，核对收货地址，送达后及时更新订单。</p><a class="button light" href="/rider?tab=available">查看待配送任务</a></div><div class="welcome-note"><strong th:text="${#lists.size(availableOrders)}"></strong><small>个任务等待配送</small></div></div><div class="stats" th:if="${tab=='overview'}"><a class="stat" href="/rider?tab=available"><div><small>待领取任务</small><strong th:text="${#lists.size(availableOrders)}"></strong></div><span class="stat-tag">去接单</span></a><a class="stat" href="/rider?tab=orders"><div><small>本人累计任务</small><strong th:text="${#lists.size(myOrders)}"></strong></div><span class="stat-tag">查看记录</span></a><div class="stat"><div><small>配送范围</small><strong style="font-size:23px">校园内</strong></div><span class="stat-tag">楼栋配送</span></div></div><section th:if="${tab=='overview' or tab=='available'}"><div class="page-heading"><div><h1>待配送大厅</h1><p>接单后订单进入配送中，任务仅由一名骑手领取。</p></div></div><section th:replace="~{fragments :: orders(${availableOrders})}"></section></section><section th:if="${tab=='orders'}"><div class="page-heading"><div><h1>我的配送</h1><p>核对收货地址，送达后点击“标记已送达”。</p></div></div><section th:replace="~{fragments :: orders(${myOrders})}"></section></section>
</main></div></body></html>
