<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>商家工作台 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('商家工作台')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="welcome" th:if="${tab=='overview'}"><div><h1 th:text="${shop.name}"></h1><p>查看待接订单，更新制作进度与菜单。</p><a class="button light" href="/merchant?tab=orders">处理订单</a></div><div class="welcome-note"><strong th:text="${shop.open?'营业中':'休息中'}" style="font-size:26px"></strong><small>在店铺设置中更新营业状态</small></div></div><div class="stats" th:if="${tab=='overview'}"><a href="/merchant?tab=orders" class="stat"><div><small>等待接单</small><strong th:text="${pendingCount}"></strong></div><span class="stat-tag">及时处理</span></a><a href="/merchant?tab=orders" class="stat"><div><small>制作中</small><strong th:text="${makingCount}"></strong></div><span class="stat-tag">准备出餐</span></a><div class="stat"><div><small>已完成订单金额 · 模拟</small><strong th:text="${'¥ '+completedAmount}" style="font-size:25px"></strong></div></div></div>
<section th:if="${tab=='overview' or tab=='orders'}"><div class="section-heading"><h2>本店订单</h2><small>接单后制作完成，骑手即可领取配送任务</small></div><section th:replace="~{fragments :: orders(${orders})}"></section></section>
<section th:if="${tab=='dishes'}"><div class="page-heading"><div><h1>菜品管理</h1><p>更新名称、分类和价格，历史订单保留原价格快照。</p></div></div><div class="card"><h2>新增菜品</h2><form class="form-grid" th:action="@{/merchant/dishes}" method="post" style="grid-template-columns:1fr 2fr 1fr auto"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>分类<input name="category" maxlength="40" placeholder="例如 主食" required></label><label>菜品名称<input name="name" maxlength="80" required></label><label>单价 / 元<input name="price" type="number" min="0.01" max="9999.99" step="0.01" required></label><div style="align-self:end;margin-bottom:6px"><button>添加并上架</button></div></form></div><section class="card" data-filter-zone><div class="toolbar"><h2 class="no-margin">菜单列表</h2><label class="search-label" style="margin-left:auto"><span class="sr-only">搜索菜品</span><input type="search" data-search-input placeholder="搜索菜品…"></label></div><table class="table"><thead><tr><th>菜品名称</th><th>分类</th><th>价格</th><th>售卖状态</th><th>操作</th></tr></thead><tbody><tr th:each="dish:${dishes}" data-filter-item><td><div class="dish-table-item"><img class="dish-thumbnail" th:src="${dish.imagePath}" th:alt="${dish.name}" width="84" height="70" loading="lazy"><strong th:text="${dish.name}"></strong></div></td><td th:text="${dish.category}"></td><td th:text="${'¥ '+dish.price}"></td><td><span class="status" th:classappend="${dish.onSale?'COMPLETED':'CANCELED'}" th:text="${dish.onSale?'在售':'已下架'}"></span></td><td><div class="actions"><form th:action="@{/merchant/dishes/{id}/toggle(id=${dish.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button subtle" th:text="${dish.onSale?'下架':'上架'}"></button></form><details class="editor"><summary>编辑菜品</summary><form class="form-grid" th:action="@{/merchant/dishes/{id}/edit(id=${dish.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="full">名称<input name="name" th:value="${dish.name}" maxlength="80" required></label><label>分类<input name="category" th:value="${dish.category}" maxlength="40" required></label><label>价格<input name="price" th:value="${dish.price}" type="number" min="0.01" max="9999.99" step="0.01" required></label><div class="full"><button>保存修改</button></div></form></details></div></td></tr></tbody></table><div class="empty-state no-results" hidden><h3>未找到餐品</h3></div><div class="empty-state" th:if="${#lists.isEmpty(dishes)}"><h3>菜单还没有餐品</h3><p>添加第一道菜，开始营业。</p></div></section></section>
<section th:if="${tab=='shop'}"><div class="page-heading"><div><h1>店铺设置</h1><p>让学生看到准确的店铺信息和营业状态。</p></div></div><div class="card wide-card"><form class="form-grid" th:action="@{/merchant/shop}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="full">店铺名称<input name="name" th:value="${shop.name}" maxlength="80" required></label><label class="full">店铺简介<textarea name="description" rows="4" maxlength="255" th:text="${shop.description}" required></textarea></label><label class="full">营业状态<select name="open"><option value="true" th:selected="${shop.open}">营业中 · 接受学生下单</option><option value="false" th:selected="${!shop.open}">休息中 · 暂停新订单</option></select><small class="field-hint">暂停营业后，仍需完成已有订单。</small></label><div class="full"><button>保存店铺信息</button></div></form></div></section>
</main></div></body></html>
