<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>账号登录 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><div class="auth-layout"><aside class="auth-aside"><a class="brand" href="/"><span class="brand-dot"></span><span>校园好味道<small>校内订餐与配送</small></span></a><div class="auth-copy"><img class="auth-photo" src="/images/meal-cover.webp" alt="餐食展示" width="640" height="420"><h1>校园订餐<br>与配送系统</h1><p>学生点餐，商家接单，骑手配送。<br>登录后进入对应的工作页面。</p></div><small>校内配送　/　模拟支付　/　订单可追踪</small><div class="photo-credit">餐品图片为示意图 · <a href="/images/credits.html">图片来源</a></div></aside><main class="auth-main"><div class="auth-box"><h1>欢迎回来</h1><div th:replace="~{fragments :: alerts}"></div><p class="muted">使用学生、商家、骑手或管理员账号登录。</p><div class="alert error" th:if="${param.error}">账号或密码错误，或账号已被停用。</div><div class="alert error" th:if="${param.disabled}">账号已停用，请联系平台管理员。</div><div class="alert success" role="status" th:if="${param.changed}">密码已修改，请使用新密码登录。</div><div class="alert error" role="alert" th:if="${param.expired}">登录信息已更新，请重新登录。</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" placeholder="输入你的用户名" required autofocus></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入你的密码" required></div><button class="full-button">登录系统</button></form><div class="auth-divider">演示账号 · 点击填入后登录</div><div class="demo-grid"><button type="button" data-demo-account="student">学生</button><button type="button" data-demo-account="merchant">商家</button><button type="button" data-demo-account="rider">骑手</button><button type="button" data-demo-account="admin">管理员</button></div><p class="auth-tail">还没有学生账号？ <a href="/register">立即注册</a><span style="float:right"><a href="/">返回首页</a></span></p></div></main></div></body></html>
