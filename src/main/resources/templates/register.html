<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>创建学生账号 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><div class="auth-layout"><aside class="auth-aside"><a class="brand" href="/"><span class="brand-dot"></span><span>校园好味道<small>校内订餐与配送</small></span></a><div class="auth-copy"><img class="auth-photo" src="/images/meal-cover.webp" alt="餐食展示" width="640" height="420"><h1>校园订餐<br>与配送系统</h1><p>学生点餐，商家接单，骑手配送。<br>登录后进入对应的工作页面。</p></div><small>校内配送　/　模拟支付　/　订单可追踪</small><div class="photo-credit">餐品图片为示意图 · <a href="/images/credits.html">图片来源</a></div></aside><main class="auth-main"><div class="auth-box"><h1>创建学生账号</h1><div th:replace="~{fragments :: alerts}"></div><p class="muted">本入口仅开放学生注册。</p><form th:action="@{/register}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">用户名</label><input id="username" name="username" pattern="[A-Za-z0-9_]{3,40}" autocomplete="username" maxlength="40" placeholder="3–40 位字母、数字或下划线" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="64" placeholder="至少 6 位" required></div><div class="field"><label for="realName">姓名</label><input id="realName" name="realName" maxlength="40" autocomplete="name" required></div><div class="field"><label for="phone">手机号码</label><input id="phone" name="phone" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="tel" required></div><button class="full-button">创建账号</button></form><p class="auth-tail">已有账号？ <a href="/login">返回登录</a></p><div class="notice">商家和骑手账号由管理员创建，本入口仅注册学生。</div></div></main></div></body></html>
