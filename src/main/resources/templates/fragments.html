<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><body>
<aside class="sidebar" th:fragment="sidebar">
<a class="brand" href="/home"><span class="brand-dot"></span><span>校园好味道<small>校内订餐与配送</small></span></a>
<div class="nav-caption" th:text="${roleLabel}"></div>
<nav class="side-nav" aria-label="主要导航">
<a th:href="${roleHome}" th:classappend="${tab=='overview' and currentPath==roleHome ? 'active' : ''}"><span>工作台概览</span></a>
<th:block th:if="${currentUser.role=='STUDENT'}">
<a href="/student?tab=shops" th:classappend="${tab=='shops' or #strings.contains(currentPath,'/shop/') ? 'active' : ''}"><span>浏览店铺</span></a>
<a href="/student/cart" th:classappend="${currentPath=='/student/cart' ? 'active' : ''}"><span>购物车</span><span class="nav-badge" th:text="${cartCount}"></span></a>
<a href="/student?tab=orders" th:classappend="${tab=='orders' or #strings.startsWith(currentPath,'/orders/') ? 'active' : ''}"><span>我的订单</span></a>
<a href="/student?tab=addresses" th:classappend="${tab=='addresses' ? 'active' : ''}"><span>收货地址</span></a>
</th:block>
<th:block th:if="${currentUser.role=='MERCHANT'}">
<a href="/merchant?tab=orders" th:classappend="${tab=='orders' ? 'active' : ''}"><span>订单处理</span></a>
<a href="/merchant?tab=dishes" th:classappend="${tab=='dishes' ? 'active' : ''}"><span>菜品管理</span></a>
<a href="/merchant?tab=shop" th:classappend="${tab=='shop' ? 'active' : ''}"><span>店铺设置</span></a>
</th:block>
<th:block th:if="${currentUser.role=='RIDER'}">
<a href="/rider?tab=available" th:classappend="${tab=='available' ? 'active' : ''}"><span>待配送大厅</span></a>
<a href="/rider?tab=orders" th:classappend="${tab=='orders' ? 'active' : ''}"><span>我的配送</span></a>
</th:block>
<th:block th:if="${currentUser.role=='ADMIN'}">
<a href="/admin?tab=users" th:classappend="${tab=='users' ? 'active' : ''}"><span>账号管理</span></a>
<a href="/admin?tab=shops" th:classappend="${tab=='shops' ? 'active' : ''}"><span>店铺管理</span></a>
<a href="/admin?tab=orders" th:classappend="${tab=='orders' ? 'active' : ''}"><span>全站订单</span></a>
</th:block>
<a href="/account" th:classappend="${currentPath=='/account' ? 'active' : ''}"><span>个人设置</span></a>
</nav>
<div class="sidebar-bottom"><span class="live-dot"></span>校内配送服务<div class="muted">支付为模拟流程</div><div class="photo-credit">餐品图片为示意图<br><a href="/images/credits.html">图片来源</a></div></div>
</aside>
<header class="topbar" th:fragment="topbar(title)"><div class="breadcrumb">校园好味道 <span>/</span> <b th:text="${title}"></b></div><div class="account"><span class="avatar" th:text="${#strings.substring(currentUser.realName,0,1)}"></span><a href="/account" th:text="${currentUser.realName}"></a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button" type="submit">退出登录</button></form></div></header>
<div th:fragment="alerts"><div class="alert success" role="status" th:if="${success}" th:text="${success}"></div><div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div></div>
<section th:fragment="orders(rows)" class="order-section" data-filter-zone>
<div class="toolbar"><label class="search-label"><span class="sr-only">搜索订单</span><input data-search-input placeholder="搜索订单号、店铺或菜品…" type="search"></label><select data-status-select aria-label="按订单状态筛选"><option value="">全部状态</option><option value="UNPAID">待支付</option><option value="PENDING_ACCEPT">待接单</option><option value="MAKING">制作中</option><option value="READY">待配送</option><option value="DELIVERING">配送中</option><option value="WAIT_CONFIRM">待确认</option><option value="COMPLETED">已完成</option><option value="CANCELED">已取消</option></select><a class="button subtle" th:href="${roleHome+'?tab=orders'}">刷新订单</a></div>
<div class="empty-state" th:if="${#lists.isEmpty(rows)}"><h3>这里暂时没有订单</h3><p>新的订单和配送任务会显示在这里。</p></div>
<article class="order-card" th:each="order:${rows}" data-filter-item th:attr="data-status=${order.status}">
<div class="order-card-head"><div><a class="order-number" th:href="@{/orders/{id}(id=${order.id})}" th:text="${order.orderNo}"></a><span class="order-date" th:text="${#temporals.format(order.createdAt,'MM-dd HH:mm')}"></span></div><span class="status" th:classappend="${order.status}" th:text="${order.statusLabel}"></span></div>
<div class="order-card-body"><div><h3 th:text="${order.shopName}"></h3><div class="order-items"><span th:each="item:${order.items}" th:text="${item.dishName+' × '+item.quantity}"></span></div><p class="address-line" th:text="${order.addressSnapshot}"></p></div><div class="order-amount"><small>订单金额</small><strong th:text="${'¥ '+order.amount}"></strong></div></div>
<div class="order-card-foot"><a th:href="@{/orders/{id}(id=${order.id})}">查看详情</a><div th:replace="~{fragments :: orderActions(${order})}"></div></div>
</article>
<div class="empty-state no-results" hidden><h3>没有符合条件的结果</h3><p>试试更短的关键词或切换筛选条件。</p></div>
</section>
<div class="actions" th:fragment="orderActions(order)">
<th:block th:if="${currentUser.role=='STUDENT'}">
<form th:if="${order.status=='UNPAID'}" th:action="@{/student/orders/{id}/pay(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">模拟支付</button></form>
<form th:if="${order.status=='UNPAID' or order.status=='PENDING_ACCEPT'}" th:action="@{/student/orders/{id}/cancel(id=${order.id})}" method="post" data-confirm="确定取消这笔订单？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button subtle danger-text">取消订单</button></form>
<form th:if="${order.status=='WAIT_CONFIRM'}" th:action="@{/student/orders/{id}/confirm(id=${order.id})}" method="post" data-confirm="请确认已经收到餐品，再确认收货。"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>确认收货</button></form>
<form th:if="${order.status=='COMPLETED' or order.status=='CANCELED'}" th:action="@{/student/orders/{id}/reorder(id=${order.id})}" method="post" data-confirm="将按当前菜品价格重新加入购物车，并替换购物车内已有餐品，是否继续？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button subtle">再来一单</button></form>
</th:block>
<th:block th:if="${currentUser.role=='MERCHANT'}">
<form th:if="${order.status=='PENDING_ACCEPT'}" th:action="@{/merchant/orders/{id}/accept(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>接单并开始制作</button></form>
<form th:if="${order.status=='MAKING'}" th:action="@{/merchant/orders/{id}/ready(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>制作完成</button></form>
</th:block>
<th:block th:if="${currentUser.role=='RIDER'}">
<form th:if="${order.status=='READY' and order.riderId==null}" th:action="@{/rider/orders/{id}/claim(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>领取配送任务</button></form>
<form th:if="${order.status=='DELIVERING' and order.riderId==currentUser.id}" th:action="@{/rider/orders/{id}/delivered(id=${order.id})}" method="post" data-confirm="确认餐品已经送达收货地址？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>标记已送达</button></form>
</th:block>
</div>
</body></html>
