<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>购物车 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('购物车')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="page-heading"><div><h1>购物车</h1><p>每笔订单限一家店铺，下单前请核对餐品和地址。</p></div><a class="button subtle" href="/student?tab=shops">继续点餐</a></div><div class="empty-state" th:if="${#lists.isEmpty(cartRows)}"><h3>购物车还是空的</h3><p>先选一家校内店铺，再挑几道喜欢的餐品。</p><a class="button" style="margin-top:18px" href="/student?tab=shops">去逛店铺</a></div><div class="split" th:unless="${#lists.isEmpty(cartRows)}"><section class="card"><div class="section-heading"><h2>已选餐品</h2><form th:action="@{/student/cart/clear}" method="post" data-confirm="确定清空购物车？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">清空购物车</button></form></div><table class="table"><thead><tr><th>餐品</th><th>单价</th><th>数量</th><th class="text-right">小计</th></tr></thead><tbody><tr th:each="row:${cartRows}"><td><div class="dish-table-item"><img class="dish-thumbnail" th:src="${row.dish.imagePath}" th:alt="${row.dish.name}" width="84" height="70" loading="lazy"><div><strong th:text="${row.dish.name}"></strong><br><small th:text="${row.dish.shopName}"></small><span class="status CANCELED" th:if="${!row.dish.onSale}">已下架，请移除</span></div></div></td><td th:text="${'¥ '+row.dish.price}"></td><td><div class="quantity"><form th:action="@{/student/cart/remove}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="dishId" th:value="${row.dish.id}"><button aria-label="减少一份">−</button></form><span th:text="${row.quantity}"></span><form th:action="@{/student/cart/add}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="dishId" th:value="${row.dish.id}"><button aria-label="增加一份">+</button></form></div></td><td class="text-right" th:text="${'¥ '+row.subtotal}"></td></tr></tbody></table></section><section class="card sticky"><h2>订单结算</h2><div class="summary-row"><span>餐品金额</span><span th:text="${'¥ '+total}"></span></div><div class="summary-row"><span>配送费用</span><span>¥ 0.00</span></div><form th:action="@{/student/orders}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="checkoutToken" th:value="${checkoutToken}"><label>收货地址<select name="addressId" required><option value="">选择校内地址</option><option th:each="address:${addresses}" th:value="${address.id}" th:selected="${address.id==selectedAddressId}" th:text="${address.building+' '+address.room+' · '+address.contactName}"></option></select></label><a href="/student?tab=addresses" style="font-size:12px">管理收货地址</a><div class="summary-total"><span>合计</span><strong th:text="${'¥ '+total}"></strong></div><div class="notice">支付为模拟流程，不会产生真实扣款。</div><button class="full-button" th:disabled="${#lists.isEmpty(addresses)}">提交订单</button><p class="field-hint" th:if="${#lists.isEmpty(addresses)}">请先添加收货地址。</p></form></section></div>
</main></div></body></html>
