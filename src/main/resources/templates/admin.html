<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>平台管理 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('平台管理')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="welcome" th:if="${tab=='overview'}"><div><h1>平台管理</h1><p>统一维护商家、骑手与店铺，查看全站订单及处理进度。</p><a class="button light" href="/admin?tab=users">管理平台账号</a></div><div class="welcome-note"><strong th:text="${#lists.size(orders)}"></strong><small>笔订单记录</small></div></div><div class="stats" th:if="${tab=='overview'}"><a class="stat" href="/admin?tab=users"><div><small>平台账号</small><strong th:text="${#lists.size(users)}"></strong></div><span class="stat-tag">管理账号</span></a><a class="stat" href="/admin?tab=shops"><div><small>入驻店铺</small><strong th:text="${#lists.size(shops)}"></strong></div><span class="stat-tag">营业状态</span></a><a class="stat" href="/admin?tab=orders"><div><small>全站订单</small><strong th:text="${#lists.size(orders)}"></strong></div><span class="stat-tag">查看订单</span></a></div>
<section th:if="${tab=='overview' or tab=='orders'}"><div class="section-heading"><h2>全站订单</h2><small>真实订单记录 · 支付均为模拟</small></div><section th:replace="~{fragments :: orders(${orders})}"></section></section>
<section th:if="${tab=='users'}"><div class="page-heading"><div><h1>账号管理</h1><p>商家与骑手账号由平台创建，学生自行注册。</p></div></div><div class="card"><h2>创建商家 / 骑手账号</h2><form class="form-grid" th:action="@{/admin/users}" method="post" style="grid-template-columns:repeat(3,1fr)"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>用户名<input name="username" pattern="[A-Za-z0-9_]{3,40}" placeholder="字母、数字或下划线" required></label><label>初始密码<input name="password" type="password" minlength="6" maxlength="64" required></label><label>账号角色<select name="role"><option value="MERCHANT">商家</option><option value="RIDER">骑手</option></select></label><label>姓名<input name="realName" maxlength="40" required></label><label>手机号码<input name="phone" pattern="1[3-9][0-9]{9}" maxlength="11" required></label><div style="align-self:end;margin-bottom:6px"><button>创建账号</button></div></form></div><section class="card" data-filter-zone><div class="toolbar"><h2 class="no-margin">平台账号</h2><label class="search-label" style="margin-left:auto"><span class="sr-only">搜索账号</span><input type="search" data-search-input placeholder="搜索姓名、账号或电话…"></label></div><table class="table"><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>电话</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="user:${users}" data-filter-item><td th:text="${user.username}"></td><td th:text="${user.realName}"></td><td th:text="${user.role=='STUDENT'?'学生':user.role=='MERCHANT'?'商家':user.role=='RIDER'?'骑手':'管理员'}"></td><td th:text="${user.phone}"></td><td><span class="status" th:classappend="${user.enabled?'COMPLETED':'CANCELED'}" th:text="${user.enabled?'启用':'停用'}"></span></td><td><form th:if="${user.role!='ADMIN'}" th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" data-confirm="确定更改该账号的启用状态？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!user.enabled}"><button class="button subtle" th:text="${user.enabled?'停用账号':'启用账号'}"></button></form><small th:if="${user.role=='ADMIN'}">管理员账号</small></td></tr></tbody></table><div class="empty-state no-results" hidden><h3>未找到账号</h3></div></section></section>
<section th:if="${tab=='shops'}"><div class="page-heading"><div><h1>店铺管理</h1><p>暂停营业会停止新订单，不影响已有订单的处理。</p></div></div><section class="card"><table class="table"><thead><tr><th>店铺</th><th>店铺简介</th><th>营业状态</th><th>操作</th></tr></thead><tbody><tr th:each="shop:${shops}"><td><strong th:text="${shop.name}"></strong></td><td th:text="${shop.description}"></td><td><span class="status" th:classappend="${shop.open?'COMPLETED':'CANCELED'}" th:text="${shop.open?'营业中':'已暂停'}"></span></td><td><form th:action="@{/admin/shops/{id}/toggle(id=${shop.id})}" method="post" data-confirm="确定更改店铺营业状态？"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="open" th:value="${!shop.open}"><button class="button subtle" th:text="${shop.open?'暂停营业':'恢复营业'}"></button></form></td></tr></tbody></table></section></section>
</main></div></body></html>
