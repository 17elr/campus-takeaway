<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>订单详情 · 校园好味道</title><link rel="stylesheet" href="/css/app.css"><script src="/js/app.js" defer></script></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="shell"><header th:replace="~{fragments :: topbar('订单详情')}"></header><main class="content"><div th:replace="~{fragments :: alerts}"></div>
<div class="page-heading"><div><h1>订单详情</h1><p th:text="${order.orderNo}"></p></div><a class="button subtle" th:href="${roleHome+'?tab=orders'}">返回订单列表</a></div><div class="split"><div><section class="card"><div class="detail-status"><div><span class="status" th:classappend="${order.status}" th:text="${order.statusLabel}"></span><h2 style="margin-top:13px" th:text="${order.shopName}"></h2><small th:text="${'下单时间 '+#temporals.format(order.createdAt,'yyyy-MM-dd HH:mm:ss')}"></small></div><div th:replace="~{fragments :: orderActions(${order})}"></div></div><div class="notice" th:if="${order.status=='UNPAID'}">本系统仅支持模拟支付，不会产生真实扣款。</div><div class="process"><span th:classappend="${order.status=='UNPAID'?'current':''}">待支付</span><span th:classappend="${order.status=='PENDING_ACCEPT'?'current':''}">待接单</span><span th:classappend="${order.status=='MAKING'?'current':''}">制作中</span><span th:classappend="${order.status=='READY'?'current':''}">待配送</span><span th:classappend="${order.status=='DELIVERING'?'current':''}">配送中</span><span th:classappend="${order.status=='WAIT_CONFIRM'?'current':''}">待确认</span><span th:classappend="${order.status=='COMPLETED'?'current':''}">已完成</span></div><h3>餐品明细</h3><table class="table"><thead><tr><th>餐品</th><th>下单单价</th><th>数量</th><th class="text-right">小计</th></tr></thead><tbody><tr th:each="item:${order.items}"><td th:text="${item.dishName}"></td><td th:text="${'¥ '+item.unitPrice}"></td><td th:text="${item.quantity}"></td><td class="text-right" th:text="${'¥ '+item.subtotal}"></td></tr></tbody></table><div class="summary-total"><span>订单总额</span><strong th:text="${'¥ '+order.amount}"></strong></div></section><section class="card"><h2>收货信息</h2><p th:text="${order.addressSnapshot}"></p><small>该地址保存于下单时，后续地址修改不会改变本订单。</small></section></div><section class="card sticky"><h2>订单轨迹</h2><ol class="timeline"><li th:each="event:${events}"><h3 th:text="${event.label}"></h3><small th:text="${event.operatorName}"></small><small th:text="${#temporals.format(event.createdAt,'MM-dd HH:mm:ss')}"></small></li></ol><div th:if="${#lists.isEmpty(events)}" class="muted">该订单创建于轨迹功能启用之前。</div><a class="button subtle full-button" style="margin-top:25px" th:href="@{/orders/{id}(id=${order.id})}">刷新进度</a></section></div>
</main></div></body></html>
